namespace: prod 

replicaCount: 3

resourceQuota:
  name: prod-quota
  requestsCpu: "2"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi
  pods: "50"

config:
  httpPort: "3000"
  logLevel: "warn"
  dbHost: "cart-db"
  dbPort: "5432"
  dbName: "cart-api-db"
  dbSslMode: "disable"

service:
  type: LoadBalancer

secret:
  dbUser: "postgres"
  dbPassword: "postgres"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "512Mi"

autoscaling:
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

postgres:
  name: cart-db
  replicaCount: 1
  port: 5432

  labels:
    app: cart-db

  image: postgres:15
  db: cart-api-db
  user: postgres
  password: postgres

  storage:
    volumeName: cart-db-storage
    mountPath: /var/lib/postgresql/data
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: standard

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "800m"
      memory: "1Gi"